<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep obsidian squircle background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161922" />
      <stop offset="50%" stop-color="#0D0F14" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <!-- Specular glass rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3DDB94" stop-opacity="0.28" />
    </linearGradient>

    <!-- Primary Emerald-Cyan Orbital Gauge Gradient -->
    <linearGradient id="orbitPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDB94" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Secondary Argon Glass Ring Gradient -->
    <linearGradient id="orbitSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Inner Frosted Glass Card Gradient -->
    <linearGradient id="glassPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Ambient Zero-G Glow -->
  <circle cx="256" cy="256" r="150" fill="#3DDB94" opacity="0.08" filter="url(#softGlow)" />

  <!-- Inner Frosted Glass Disc -->
  <circle cx="256" cy="256" r="176" fill="url(#glassPlate)" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

  <!-- Outer Quota Track -->
  <circle cx="256" cy="256" r="136" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="24" />

  <!-- Outer Quota Active Arc (82%) -->
  <circle
    cx="256"
    cy="256"
    r="136"
    fill="none"
    stroke="url(#orbitPrimary)"
    stroke-width="24"
    stroke-linecap="round"
    stroke-dasharray="680 855"
    transform="rotate(-90 256 256)"
    filter="url(#softGlow)"
  />

  <!-- Inner Quota Track -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="18" />

  <!-- Inner Quota Active Arc (65%) -->
  <circle
    cx="256"
    cy="256"
    r="96"
    fill="none"
    stroke="url(#orbitSecondary)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-dasharray="410 603"
    transform="rotate(-45 256 256)"
  />

  <!-- Center Antigravity Sparkle Core -->
  <path
    d="M256 204 C260 236, 276 252, 308 256 C276 260, 260 276, 256 308 C252 276, 236 260, 204 256 C236 252, 252 236, 256 204 Z"
    fill="#FFFFFF"
    filter="url(#softGlow)"
  />
</svg>
